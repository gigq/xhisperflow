[package]
name = "xhisperflow"
version = "0.1.0"
edition = "2024"

[features]
default = ["local-whisper", "local-parakeet"]
local-whisper = ["dep:whisper-rs"]
local-parakeet = ["dep:parakeet-rs", "dep:ort"]
vulkan = ["local-whisper", "whisper-rs/vulkan"]
metal = ["local-whisper", "whisper-rs/metal"]

[dependencies]
anyhow = "1.0"
hound = "3.5"
rubato = "0.16"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde_json = "1.0"
tempfile = "3.13"
whisper-rs = { version = "0.16.0", optional = true }
parakeet-rs = { version = "=0.3.5", optional = true }
# Keep the runtime API aligned with this parakeet-rs release.
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = "3.6"
block = "0.1"
cocoa = "0.26"
core-foundation = "0.10"
core-graphics = "0.25"
cpal = "0.17"
enigo = { version = "0.6", default-features = false }
global-hotkey = "0.7"
objc = "0.2"
raw-window-handle = "0.6"
softbuffer = { version = "0.4", default-features = false }
tray-icon = { version = "0.22", default-features = false }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-client = "0.31"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }

[[bin]]
name = "xhisperflow"
path = "src/bin/xhisperflow.rs"

[[bin]]
name = "xhisperflowtool"
path = "src/bin/xhisperflowtool.rs"

[[bin]]
name = "xhisperflowtoold"
path = "src/bin/xhisperflowtoold.rs"

[[bin]]
name = "xhisperflow-mac"
path = "src/bin/xhisperflow-mac.rs"
